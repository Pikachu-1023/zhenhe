<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>職業足球員模擬器 RPG Online</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; padding: 15px; }
    .container { max-width: 1000px; margin: 0 auto; display: none; }
    h1 { text-align: center; color: #38bdf8; margin-bottom: 15px; }
    
    /* 登入彈窗 */
    .auth-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.95); display: flex; justify-content: center; align-items: center; z-index: 1000; }
    .auth-card { background: #1e293b; border: 1px solid #334155; padding: 25px; border-radius: 10px; width: 320px; text-align: center; }
    .auth-input { width: 100%; padding: 8px; margin-bottom: 10px; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 4px; }

    /* 頂部狀態列 */
    .status-bar { background: #1e293b; padding: 12px; border-radius: 8px; display: flex; gap: 15px; flex-wrap: wrap; justify-content: space-between; border: 1px solid #334155; margin-bottom: 15px; }
    .val { color: #f59e0b; font-weight: bold; }
    
    /* 分頁標籤欄 */
    .nav-tabs { display: flex; gap: 8px; margin-bottom: 15px; border-bottom: 2px solid #334155; padding-bottom: 8px; }
    .tab-btn { background: #1e293b; color: #94a3b8; border: 1px solid #334155; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .tab-btn.active { background: #0284c7; color: white; border-color: #38bdf8; }

    /* 分頁內容 */
    .tab-content { display: none; background: #1e293b; padding: 20px; border-radius: 8px; border: 1px solid #334155; }
    .tab-content.active { display: block; }

    /* 訓練小遊戲小舞台 */
    #game-stage { width: 100%; height: 250px; background: #064e3b; border: 2px solid #10b981; border-radius: 8px; position: relative; overflow: hidden; display: flex; justify-content: center; align-items: center; }
    .target-ball { width: 50px; height: 50px; background: #f59e0b; border-radius: 50%; position: absolute; cursor: pointer; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 1.2em; box-shadow: 0 0 10px #f59e0b; }

    /* 背包與裝備網格 */
    .item-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; margin-top: 10px; }
    .item-card { background: #0f172a; border: 1px solid #334155; padding: 10px; border-radius: 6px; font-size: 0.85em; }

    /* 通用按鈕 */
    .btn { background: #0284c7; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 6px; }
    .btn:hover { opacity: 0.9; }
    .log-box { background: #020617; border: 1px solid #334155; border-radius: 6px; padding: 10px; height: 120px; overflow-y: auto; font-family: monospace; font-size: 0.8em; color: #cbd5e1; margin-top: 15px; }
  </style>
</head>
<body>

  <!-- 登入視窗 -->
  <div class="auth-overlay" id="authOverlay">
    <div class="auth-card">
      <h2>⚽ 足球員職涯登入</h2>
      <input type="text" id="authUsername" class="auth-input" placeholder="帳號" />
      <input type="password" id="authPassword" class="auth-input" placeholder="密碼" />
      <button class="btn" style="background:#16a34a;" onclick="handleAuth('login')">登入</button>
      <button class="btn" style="background:#d97706;" onclick="handleAuth('register')">註冊帳號</button>
      <p id="authMsg" style="color:#ef4444; margin-top:10px; font-size:0.8em;"></p>
    </div>
  </div>

  <div class="container" id="mainGame">
    <h1>⚽ 職業足球員模擬器 Pro</h1>
    
    <!-- 資訊條 -->
    <div class="status-bar">
      <div>球員: <span id="p-account" class="val">-</span></div>
      <div>金幣: 💰<span id="p-coins" class="val">0</span></div>
      <div>體力: ⚡<span id="p-stamina" class="val">100</span>/100</div>
      <div>射門能力: <span id="s-shooting" class="val">0</span></div>
      <div>速度能力: <span id="s-speed" class="val">0</span></div>
      <div id="saveStatus" style="font-size:0.8em; color:#22c55e;">☁️ 自動同步中</div>
    </div>

    <!-- 分頁選單 -->
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('tab-home', this)">🏠 職涯主頁</button>
      <button class="tab-btn" onclick="switchTab('tab-training', this)">🎯 射門特訓小遊戲</button>
      <button class="tab-btn" onclick="switchTab('tab-inventory', this)">🎒 裝備與背包</button>
      <button class="tab-btn" onclick="switchTab('tab-quests', this)">📋 任務系統</button>
      <button class="tab-btn" onclick="switchTab('tab-pvp', this)">🏟️ 線上玩家 PVP 對戰</button>
    </div>

    <!-- 1. 職涯主頁 -->
    <div id="tab-home" class="tab-content active">
      <h2>📊 球員總覽</h2>
      <p style="margin-top:10px;">請透過「射門特訓小遊戲」提升實力，並於「任務系統」與「線上 PVP」賺取獎金與聲望！</p>
      <button class="btn" style="background:#64748b; margin-top:15px;" onclick="rest()">💤 理療休息 (體力+50)</button>
    </div>

    <!-- 2. 訓練小遊戲 -->
    <div id="tab-training" class="tab-content">
      <h2>⚽ 反應射門特訓小遊戲</h2>
      <p style="font-size:0.85em; color:#94a3b8; margin-bottom:10px;">規則：點擊「開始遊戲」後，目標球會在球場內隨機出現，請在 10 秒內快速點擊目標球！每次成功點擊加 1 分。</p>
      <div id="game-stage">
        <button id="start-game-btn" class="btn" style="width:150px; background:#10b981;" onclick="startShootingGame()">🎮 開始射門特訓</button>
      </div>
    </div>

    <!-- 3. 裝備與背包 -->
    <div id="tab-inventory" class="tab-content">
      <h2>👟 裝備庫與抽獎</h2>
      <button class="btn" style="background:#d97706; width:200px;" onclick="drawGacha()">🎁 盲盒抽獎 (💰500)</button>
      <h3 style="margin-top:15px; font-size:1em; color:#38bdf8;">目前配戴裝備：</h3>
      <div style="font-size:0.9em; margin:5px 0;">戰靴: <b id="eq-boots">無</b></div>

      <h3 style="margin-top:15px; font-size:1em; color:#38bdf8;">背包擁有物品：</h3>
      <div class="item-grid" id="inventory-list"></div>
    </div>

    <!-- 4. 任務系統 -->
    <div id="tab-quests" class="tab-content">
      <h2>📋 每日職涯任務</h2>
      <div style="margin-top:10px;">
        <div class="item-card">
          <b>🎯 訓練達人：完成 2 次射門小遊戲</b>
          <p>進度: <span id="q1-progress">0</span>/2</p>
          <button class="btn" style="background:#16a34a;" onclick="claimQuest(1)">領取獎勵 (💰800)</button>
        </div>
      </div>
    </div>

    <!-- 5. PVP 對戰 -->
    <div id="tab-pvp" class="tab-content">
      <h2>🏟️ 雲端玩家配對對戰</h2>
      <button class="btn" style="background:#8b5cf6; margin-bottom:15px;" onclick="loadPVPList()">🔄 整理雲端線上對手</button>
      <div id="pvp-list" class="item-grid"></div>
    </div>

    <div class="log-box" id="logBox"></div>
  </div>

  <script>
    const SUPABASE_URL = 'https://ykdojthszgipqbqroccu.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_KXokby_l71d1yZ69MDJgew_L0Ce1YKH'; // 請在此貼上你的 Key
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentAccount = null;
    let gameTimer = null;
    let gameScore = 0;
    
    let player = {
      coins: 2000, stamina: 100,
      stats: { shooting: 70, speed: 70 },
      equipment: { boots: null },
      inventory: [],
      quests: { train_count: 0, q1_claimed: false }
    };

    const gachaPool = [
      { id: 1, name: '水星刺客戰靴', type: 'boots', boost: 8 },
      { id: 2, name: '黃金龍紋戰靴', type: 'boots', boost: 12 },
      { id: 3, name: '輕型訓練鞋', type: 'boots', boost: 3 }
    ];

    function switchTab(tabId, btn) {
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      btn.classList.add('active');
    }

    async function handleAuth(type) {
      const u = document.getElementById('authUsername').value.trim();
      const p = document.getElementById('authPassword').value.trim();
      const msg = document.getElementById('authMsg');
      if(!u || !p) return msg.innerText = '請輸入帳密';

      if(type === 'register') {
        const { error } = await supabaseClient.from('accounts').insert([{ username: u, password: p }]);
        if(error) return msg.innerText = '帳號已存在';
        await supabaseClient.from('players').insert([{ user_id: u }]);
        msg.style.color = '#22c55e'; msg.innerText = '註冊成功！請登入。';
      } else {
        const { data } = await supabaseClient.from('accounts').select('*').eq('username', u).eq('password', p);
        if(!data || data.length === 0) return msg.innerText = '帳密錯誤';
        currentAccount = u;
        await loadData();
        document.getElementById('authOverlay').style.display = 'none';
        document.getElementById('mainGame').style.display = 'block';
      }
    }

    async function loadData() {
      const { data } = await supabaseClient.from('players').select('*').eq('user_id', currentAccount);
      if(data && data[0]) {
        let d = data[0];
        if(d.detailed_stats) player.stats = d.detailed_stats;
        if(d.inventory) player.inventory = d.inventory;
        if(d.full_equipment) player.equipment = d.full_equipment;
        player.coins = d.coins || 2000;
        document.getElementById('p-account').innerText = currentAccount;
        updateUI();
        addLog(`✅ 成功載入玩家 [${currentAccount}] 進度！`);
      }
    }

    function addLog(msg) {
      const box = document.getElementById('logBox');
      box.innerHTML = `<div class="log-item">[${new Date().toLocaleTimeString()}] ${msg}</div>` + box.innerHTML;
    }

    async function autoSave() {
      if(!currentAccount) return;
      await supabaseClient.from('players').upsert([{
        user_id: currentAccount, coins: player.coins,
        detailed_stats: player.stats, full_equipment: player.equipment, inventory: player.inventory
      }]);
    }

    function updateUI() {
      document.getElementById('p-coins').innerText = player.coins;
      document.getElementById('p-stamina').innerText = player.stamina;
      document.getElementById('s-shooting').innerText = player.stats.shooting;
      document.getElementById('s-speed').innerText = player.stats.speed;
      document.getElementById('eq-boots').innerText = player.equipment.boots ? player.equipment.boots.name : '無';
      document.getElementById('q1-progress').innerText = player.quests.train_count;

      // 渲染背包
      const invList = document.getElementById('inventory-list');
      invList.innerHTML = '';
      player.inventory.forEach((item, idx) => {
        invList.innerHTML += `
          <div class="item-card">
            <b>${item.name}</b> (射門+${item.boost})
            <button class="btn" style="background:#10b981;" onclick="equipItem(${idx})">裝備</button>
          </div>`;
      });

      autoSave();
    }

    /* 射門小遊戲邏輯 */
    function startShootingGame() {
      if(player.stamina < 20) return addLog('❌ 體力不足 20，無法進行特訓！');
      player.stamina -= 20;
      gameScore = 0;
      const stage = document.getElementById('game-stage');
      stage.innerHTML = '';
      
      let timeLeft = 10;
      spawnBall();

      gameTimer = setInterval(() => {
        timeLeft--;
        if(timeLeft <= 0) {
          clearInterval(gameTimer);
          stage.innerHTML = `<button id="start-game-btn" class="btn" style="width:150px; background:#10b981;" onclick="startShootingGame()">🎮 再次挑戰</button>`;
          let gain = Math.floor(gameScore / 2);
          player.stats.shooting += gain;
          player.quests.train_count++;
          addLog(`🎉 特訓結束！你在小遊戲中得分: ${gameScore}，射門能力提升 +${gain}！`);
          updateUI();
        }
      }, 1000);
    }

    function spawnBall() {
      const stage = document.getElementById('game-stage');
      const oldBall = document.querySelector('.target-ball');
      if(oldBall) oldBall.remove();

      const ball = document.createElement('div');
      ball.className = 'target-ball';
      ball.innerText = '⚽';
      ball.style.top = Math.floor(Math.random() * 180) + 'px';
      ball.style.left = Math.floor(Math.random() * 80) + '%';
      ball.onclick = () => {
        gameScore++;
        spawnBall();
      };
      stage.appendChild(ball);
    }

    /* 抽獎與裝備 */
    function drawGacha() {
      if(player.coins < 500) return addLog('❌ 金幣不足 500！');
      player.coins -= 500;
      const item = gachaPool[Math.floor(Math.random() * gachaPool.length)];
      player.inventory.push(item);
      addLog(`🎁 抽中裝備【${item.name}】並放入背包！`);
      updateUI();
    }

    function equipItem(idx) {
      const item = player.inventory[idx];
      player.equipment.boots = item;
      player.stats.shooting += item.boost;
      addLog(`👟 成功裝備【${item.name}】，射門能力增加 +${item.boost}！`);
      updateUI();
    }

    /* 任務 */
    function claimQuest(id) {
      if(player.quests.train_count >= 2 && !player.quests.q1_claimed) {
        player.coins += 800;
        player.quests.q1_claimed = true;
        addLog('💰 成功完成每日訓練任務！領取金幣 +800！');
        updateUI();
      } else {
        addLog('❌ 任務尚未達成或已領取！');
      }
    }

    /* PVP 線上玩家對戰 */
    async function loadPVPList() {
      const { data } = await supabaseClient.from('players').select('*').limit(5);
      const list = document.getElementById('pvp-list');
      list.innerHTML = '';
      if(data) {
        data.forEach(opp => {
          if(opp.user_id !== currentAccount) {
            list.innerHTML += `
              <div class="item-card">
                <b>⚽ 玩家: ${opp.user_id}</b>
                <p>射門能力: ${opp.detailed_stats?.shooting || 70}</p>
                <button class="btn" style="background:#dc2626;" onclick="challengePlayer('${opp.user_id}', ${opp.detailed_stats?.shooting || 70})">挑戰此玩家</button>
              </div>`;
          }
        });
      }
    }

    function challengePlayer(oppId, oppShooting) {
      let myPower = player.stats.shooting + (player.equipment.boots ? player.equipment.boots.boost : 0);
      if(myPower > oppShooting) {
        player.coins += 500;
        addLog(`🏆 擊敗線上玩家 [${oppId}]！獲得獎金 💰500！`);
      } else {
        addLog(`💔 不敵玩家 [${oppId}]，回去多做射門特訓吧！`);
      }
      updateUI();
    }

    function rest() { player.stamina = Math.min(100, player.stamina + 50); addLog('💤 充分休息，體力 +50。'); updateUI(); }
  </script>
</body>
</html>
